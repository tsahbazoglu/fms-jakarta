<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"   
      xmlns:composite="jakarta.faces.composite"
      xmlns:p="http://primefaces.org/ui"
      xmlns:h="jakarta.faces.html"
      xmlns:c="jakarta.tags.core">

    <h:head>
        <title></title>
    </h:head>

    <composite:interface>
        <composite:attribute name="items" required="true"/>
        <composite:attribute name="imgsrc" required="true"/>
    </composite:interface>

    <composite:implementation>
        <c:forEach items="#{cc.attrs.items}" var="selectitem">
            <p:chip label="#{selectitem.label}" styleClass="p-mr-2" image="#{cc.attrs.imgsrc}"/>
            <p:spacer width="10" height="10"/>               
        </c:forEach>
    </composite:implementation>
</html>

<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"   
      xmlns:composite="jakarta.faces.composite"
      xmlns:p="http://primefaces.org/ui"
      xmlns:c="jakarta.tags.core"
      xmlns:f="jakarta.faces.core"
      xmlns:h="jakarta.faces.html">

    <composite:interface>
        <composite:attribute name="fmsupdate" required="true"/>
        <composite:attribute name="rows" required="true"/>
        <composite:attribute name="selectedFormInfo"/>
        <composite:attribute name="myAction" method-signature="java.lang.String myAction()" />
        <composite:attribute name="myActionListener" method-signature="void myActionListener(jakarta.faces.event.AjaxBehaviorEvent)" />
        <composite:attribute name="myOnPaneChange" method-signature="void myOnPaneChange(org.primefaces.event.TabChangeEvent)" />
    </composite:interface>

    <composite:implementation>
        <p:menu 
            toggleable="true" 
            styleClass="w-full fms-accordion-menu"
            >    
            <c:forEach items="#{cc.attrs.rows}" var="item">
                <p:submenu 
                    label="#{item.name}" 
                    expanded="false"
                    >
                    <p:menuitem
                        value="Hakkında ..." 
                        action="#{cc.attrs.myAction}" 
                        update="#{cc.attrs.fmsupdate}"
                        icon="pi pi-home"
                        onclick="$('.fms-highlight').removeClass('fms-highlight');$(this).addClass('fms-highlight')"
                        rendered="false"
                        >
                        <f:setPropertyActionListener 
                            target="#{cc.attrs.selectedFormInfo}" 
                            value="about,#{item.projectKey},#{item.moduleKey}"
                            />
                    </p:menuitem>
                    <c:forEach items="#{item.myLinks}" var="item">
                        <p:menuitem 
                            value="#{item.label}"
                            update="#{item.jsfupdate}"
                            action="#{cc.attrs.myAction}"
                            icon="pi pi-file"
                            onclick="$('.fms-highlight').removeClass('fms-highlight');$(this).addClass('fms-highlight')"
                            styleClass="#{item.value eq cc.attrs.selectedFormInfo ? 'fms-highlight' : ''}" 
                            >
                            <f:setPropertyActionListener 
                                target="#{cc.attrs.selectedFormInfo}" 
                                value="#{item.value}"/>
                        </p:menuitem>
                    </c:forEach>                   
                </p:submenu>
            </c:forEach>
        </p:menu> 
    </composite:implementation>
</html>

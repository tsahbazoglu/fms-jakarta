<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"   
      xmlns:composite="jakarta.faces.composite"
      xmlns:p="http://primefaces.org/ui"
      xmlns:c="jakarta.tags.core"
      xmlns:f="jakarta.faces.core"
      xmlns:h="jakarta.faces.html"
      >

    <h:head>
        <title></title>
    </h:head>

    <composite:interface>
        <composite:attribute name="fmsupdate" required="true"/>
        <composite:attribute name="rows" required="true"/>
        <composite:attribute name="selectedFormInfo"/>
        <composite:attribute name="myAction" method-signature="java.lang.String myAction()" />
        <composite:attribute name="myActionListener" method-signature="void myActionListener(jakarta.faces.event.AjaxBehaviorEvent)" />
        <composite:attribute name="myOnPaneChange" method-signature="void myOnPaneChange(org.primefaces.event.TabChangeEvent)" />
    </composite:interface>

    <composite:implementation>
        <style>
            .fms-highlight{
                background-color: rgb(23, 209, 230);
                font-weight: bold!important;
            }

            .ui-menu {
                overflow-y: scroll;
                height: 550px;
            }

        </style>
        <p:menu 
            toggleable="true" 
            style="width: 100%;" 
            styleClass="large-font-size"
            >    
            <c:forEach items="#{cc.attrs.rows}" var="item">
                <p:submenu 
                    label="#{item.name}" 
                    expanded="false"
                    styleClass="medium-font-size"
                    >
                    <p:menuitem
                        value="Hakkında ..." 
                        action="#{cc.attrs.myAction}" 
                        update="#{cc.attrs.fmsupdate}"
                        icon="ui-icon-home"
                        styleClass="medium-font-size"
                        onclick="$('.fms-highlight').removeClass('fms-highlight');$(this).addClass('fms-highlight')"
                        rendered="false"
                        >
                        <f:setPropertyActionListener 
                            target="#{cc.attrs.selectedFormInfo}" 
                            value="about,#{item.projectKey},#{item.moduleKey}"
                            />
                    </p:menuitem>
                    <c:forEach items="#{item.myLinks}" var="item">
                        <p:menuitem 
                            value="#{item.label}"
                            update="#{item.jsfupdate}"
                            action="#{cc.attrs.myAction}"
                            icon="ui-icon-document"
                            onclick="$('.fms-highlight').removeClass('fms-highlight');$(this).addClass('fms-highlight')"
                            styleClass="#{item.value eq cc.attrs.selectedFormInfo?'fms-highlight':''} medium-font-size" 
                            >
                            <f:setPropertyActionListener 
                                target="#{cc.attrs.selectedFormInfo}" 
                                value="#{item.value}"/>
                        </p:menuitem>
                    </c:forEach>                   
                </p:submenu>
            </c:forEach>
        </p:menu> 
    </composite:implementation>
</html>

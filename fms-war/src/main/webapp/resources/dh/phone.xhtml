<?xml version="1.0" encoding="UTF-8"?>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:composite="jakarta.faces.composite">

<composite:interface componentType="phoneInput">
    <composite:attribute name="value" required="true" type="java.lang.String" />
    <composite:attribute name="styleClass" required="false" />
    <composite:attribute name="defaultCode" required="false" />
</composite:interface>

<composite:implementation>
    <div id="#{cc.clientId}" class="dh-phone-composite #{cc.attrs.styleClass}">
        <p:outputPanel id="panel" styleClass="ui-inputgroup" style="display: flex; width: 100%;">

            <!-- No value binding here: the backing component owns the real value -->
            <p:selectOneMenu id="countryCode"
                             filter="true"
                             filterMatchMode="contains"
                             panelStyle="width: 320px;"
                             style="width: 210px; min-width: 210px;"
                             scrollHeight="250">

                <f:selectItems value="#{countryRegistry.countries}" var="c"
                               itemLabel="#{c.flag} #{c.name} (#{c.code})"
                               itemValue="#{c.code}" />

                <!-- Country changed: re-render mask and clear the old number -->
                <p:ajax update="subscriber" resetValues="true" />
            </p:selectOneMenu>

            <p:inputMask id="subscriber"
                         mask="#{cc.currentMask}"
                         placeholder="Enter number"
                         validateMask="true"
                         style="width: 100%;" />
        </p:outputPanel>
    </div>
</composite:implementation>
</html>

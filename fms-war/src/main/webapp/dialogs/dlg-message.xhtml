<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<ui:composition 
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="jakarta.faces.html"
    xmlns:f="jakarta.faces.core"
    xmlns:ui="jakarta.faces.facelets"
    xmlns:p="http://primefaces.org/ui">

    <p:dialog
        id="idMessageDialog"
        widgetVar="messageDialog"
        resizable="false"
        header="#{dlgCtrl.title}"
        closable="true"
        closeOnEscape="true" 
        modal="true"
        responsive="true"
        draggable="true"
        position="center"
        visible="false"
        width="650"
        style="max-width: 95vw; max-height: 85vh;"
        styleClass="border-round shadow-3"
        >
        <f:facet name="header">
            <div class="flex align-items-center gap-2">
                <i class="pi #{dlgCtrl.severityIcon} text-xl #{dlgCtrl.severityColorClass}"/>
                <span class="font-bold text-lg text-900">#{dlgCtrl.title}</span>
            </div>
        </f:facet>

        <div class="py-2 overflow-y-auto" style="max-height: 65vh;">
            <!-- Message banner with severity styling -->
            <div class="p-3 border-round border-left-3 flex align-items-start gap-3 mb-2 #{dlgCtrl.severityContainerClass}">
                <i class="pi #{dlgCtrl.severityIcon} text-2xl #{dlgCtrl.severityColorClass} mt-1 flex-shrink-0"/>
                <div class="flex-grow-1">
                    <h:outputText 
                        id="outMsg"
                        value="#{dlgCtrl.message}"
                        styleClass="text-base line-height-3 block message-dialog-text"
                        style="#{dlgCtrl.style}"
                        escape="false"/>
                </div>
            </div>
        </div>

        <f:facet name="footer">
            <div class="flex justify-content-end gap-2 w-full">
                <p:commandButton
                    value="#{msg['kaydetmeden.cik']}"
                    icon="pi pi-times"
                    action="#{twoDimModifyCtrl.doNotSave}"
                    oncomplete="PF('messageDialog').hide()"
                    rendered="#{dlgCtrl.renderedButon}"
                    styleClass="ui-button-outlined ui-button-secondary p-button-sm"/>

                <p:button
                    value="#{msg['tamam']}"
                    icon="pi pi-check"
                    onclick="PF('messageDialog').hide();return false;"
                    rendered="#{dlgCtrl.renderedOkButon}"
                    styleClass="ui-button-primary p-button-sm"
                    />
            </div>
        </f:facet>
    </p:dialog>
</ui:composition>

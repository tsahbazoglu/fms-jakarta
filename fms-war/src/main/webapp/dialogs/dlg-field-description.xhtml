<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html 
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:p="http://primefaces.org/ui"
    >
    <p:dialog 
        id="id-desc-dlg"
        header="#{msg['aciklama.2']}"
        widgetVar="wvDescDlg"
        width="600"
        height="400"
        closable="true"
        closeOnEscape="true"                     
        position="center"
        resizable="true"
        >
        <p:panel
            id="id-desc-dlg-pnl"
            >
            <b>#{msg['form']}</b> <p:outputLabel value="#{formService.myForm.name}"/> 
            <hr/>
            <b>#{msg['alan.2']}</b> <p:outputLabel value="#{crudOneDim.selectedField.name}"/> 
            <hr/>
            <b>#{msg['aciklama.3']}</b> <p:outputLabel value="#{crudOneDim.selectedField.popupDescription}" escape="false"/>
        </p:panel>
    </p:dialog>
</html>

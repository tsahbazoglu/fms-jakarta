<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:c="jakarta.tags.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="jakarta.faces.core">

    <p:dialog id="id-dlg-user-info"
              widgetVar="wv-dlg-user-info"
              header="Kullanıcı Bilgileri &amp; Görünüm Ayarları"
              modal="true"
              responsive="true"
              closeOnEscape="true"
              width="750"
              style="max-width: 95vw; max-height: 90vh;"
              styleClass="border-round shadow-2">

        <h:form id="themeForm" styleClass="flex flex-column gap-3 py-2">
            <h:panelGroup rendered="#{not empty dlgCtrl.message}" layout="block">
                <h:outputText value="#{dlgCtrl.message}"
                              escape="false"/>
            </h:panelGroup>

            <div class="text-xl font-bold text-900 border-bottom-1 surface-border pb-2">
                <i class="pi pi-palette mr-2"></i>Görünüm Ayarları
            </div>

            <p:panel header="Yerleşim : #{templateThemeHandler.layout}" styleClass="surface-card mb-2">
                <div class="flex flex-wrap gap-2">
                    <p:commandButton value="Web Layout"
                                     actionListener="#{templateThemeHandler.changeLayout('web-layout')}"
                                     process="@this"
                                     oncomplete="window.location.reload();"
                                     styleClass="#{templateThemeHandler.layout eq 'web-layout' ? 'ui-button-primary' : 'ui-button-outlined'} p-button-sm"/>
                    <p:commandButton value="Web Layout - No Description"
                                     actionListener="#{templateThemeHandler.changeLayout('web-layout-no-description')}"
                                     process="@this"
                                     oncomplete="window.location.reload();"
                                     styleClass="#{templateThemeHandler.layout eq 'web-layout-no-description' ? 'ui-button-primary' : 'ui-button-outlined'} p-button-sm"/>
                    <p:commandButton value="Web Layout - No Description Sidebar"
                                     actionListener="#{templateThemeHandler.changeLayout('web-layout-no-description-sidebar')}"
                                     process="@this"
                                     oncomplete="window.location.reload();"
                                     styleClass="#{templateThemeHandler.layout eq 'web-layout-no-description-sidebar' ? 'ui-button-primary' : 'ui-button-outlined'} p-button-sm"/>
                </div>
            </p:panel>

            <p:panel header="Yazı Boyutu / Font Size : #{templateThemeHandler.fontSize}" styleClass="surface-card mb-2">
                <div class="flex flex-wrap align-items-center gap-2">
                    <c:forEach items="#{templateThemeHandler.fontSizes}" var="fs">
                        <p:commandButton value="#{fs}"
                                         actionListener="#{templateThemeHandler.changeFontSize(fs)}"
                                         oncomplete="document.documentElement.style.setProperty('--fms-font-size-base', '#{templateThemeHandler.fontSizePx}'); document.body.style.fontSize='#{templateThemeHandler.fontSizePx}';"
                                         process="@this"
                                         update="themeForm"
                                         styleClass="#{templateThemeHandler.fontSize eq fs ? 'ui-button-primary' : 'ui-button-outlined'} p-button-sm text-capitalize"/>
                    </c:forEach>
                </div>
            </p:panel>

            <p:panel header="Tema Seçimi : #{templateThemeHandler.theme}" styleClass="surface-card">
                <div class="flex flex-wrap align-items-center gap-2">
                    <c:forEach items="#{templateThemeHandler.themes}" var="theme" varStatus="status">
                        <p:commandButton value="#{theme}"
                                         actionListener="#{templateThemeHandler.changeContract(theme)}"
                                         oncomplete="PrimeFaces.changeTheme('#{theme}')"
                                         process="@this"
                                         update="@none"
                                         styleClass="#{templateThemeHandler.theme eq theme ? 'ui-button-primary' : 'ui-button-outlined'} p-button-sm"/>
                    </c:forEach>
                </div>
            </p:panel>
        </h:form>
    </p:dialog>
</ui:composition>

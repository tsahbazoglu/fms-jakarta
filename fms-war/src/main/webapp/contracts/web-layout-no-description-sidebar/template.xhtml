<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="http://primefaces.org/ui">

<h:head>
    <f:facet name="first">
        <meta http-equiv="X-UA-Compatible" content="IE=Edge"/>
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=0"/>
        <meta name="apple-mobile-web-app-status-bar-style" content="yes"/>
    </f:facet>

    <title>
        <ui:insert name="title">#{mainFrame.companyTitle}</ui:insert>
    </title>

    <h:outputStylesheet name="css/fms.css"/>
    <h:outputStylesheet library="webjars" name="primeflex/3.3.1/primeflex.min.css"/>

    <h:outputScript library="telmangrid" name="handsontable/handsontable.full.js"/>
    <h:outputStylesheet library="telmangrid" name="handsontable/handsontable.full.css"/>


    <f:facet name="last">
        <h:outputStylesheet name="handsontable/fms.handsontable.override.css" library="telmangrid"/>
        <style>
            :root {
                --fms-font-size-base: #{templateThemeHandler.fontSizePx};
            }
        </style>
    </f:facet>

    <h:outputScript name="js/fms-core.js" library="web-layout-no-description-sidebar"/>
    <h:outputScript library="telmangrid" name="handsontable/init3dHandson.v1.js"/>


</h:head>

<h:body>

    <!-- 1. Top Bar: Fixed at top of viewport, 100% FULL WIDTH across window edge, OVER sidebar -->
    <div class="layout-topbar-fixed">
        <h:form id="iceformTop" styleClass="w-full">
            <ui:include src="top.xhtml"/>
        </h:form>
    </div>

    <!-- 2. Push Sidebar: Positioned UNDER fixed top bar -->
    <p:sidebar widgetVar="sidebar1"
               position="left"
               modal="false"
               visible="true"
               showCloseIcon="false"
               styleClass="push-sidebar"
               onShow="$('#layout-main').addClass('layout-shifted');"
               onHide="$('#layout-main').removeClass('layout-shifted');"
    >
        <h:form id="menuForm">
            <ui:include src="menu.xhtml"/>
        </h:form>
    </p:sidebar>

    <!-- 3. Center Content Area: Positioned UNDER top bar, shifted by sidebar -->
    <div id="layout-main" class="layout-wrapper layout-shifted preload">

        <div class="main-wrapper p-0">

            <div class="grid grid-nogutter">
                <div class="col-12">
                    <p:outputPanel id="idCenterCenter" styleClass="surface-card p-0 shadow-1 border-round">

                        <p:outputPanel id="id-dlgs">
                            <ui:insert name="form-pop-ups">define form-pop-ups</ui:insert>
                        </p:outputPanel>

                        <div class="mb-0">
                            <ui:include
                                     src="/2d/table-form-header-name.xhtml"
                            />
                        </div>

                        <p:tabView id="id-tab-view" styleClass="mt-0">
                            <p:tab id="id-tab-data-input" title="Veriler">


                                <div class="grid flex-column md:flex-row mt-0">

                                    <div class="col-12">
                                        <h:panelGroup rendered="#{mainFrame.historyRendered}">
                                            <div class="p-0 py-1 border-bottom-1 surface-border mb-0">
                                                <h:outputText value="Veri Girişi" styleClass="text-lg font-bold"/>
                                                <p:tooltip for="@previous"
                                                           value="güncellenebilir veriler bu sekmede yer almaktadır"
                                                           position="top"/>
                                            </div>
                                        </h:panelGroup>

                                        <ui:insert name="current-content">define current-content</ui:insert>

                                        <h:panelGroup rendered="#{mainFrame.historyRendered}">
                                            <div class="p-0 py-1 border-bottom-1 surface-border mb-0">
                                                <h:outputText value="Tüm Veriler" styleClass="text-lg font-bold"/>
                                                <p:tooltip for="@previous"
                                                           value="tüm veriler bu sekmede yer almaktadır"
                                                           position="top"/>
                                            </div>
                                        </h:panelGroup>

                                        <h:panelGroup rendered="#{mainFrame.historyRendered}">
                                            <ui:insert name="history-content">define history-content</ui:insert>
                                        </h:panelGroup>


                                    </div>


                                </div>


                            </p:tab>

                            <p:tab id="id-tab-attachments" title="Ekli Dosyalar"
                                   rendered="#{formService.myForm.hasAttachedFiles}">
                                <div class="p-0">
                                    <ui:insert name="upload-page">define upload-page</ui:insert>
                                </div>
                            </p:tab>

                            <p:tab id="id-tab-esign" title="E-İmzalı Bildirimler"
                                   rendered="#{formService.myForm.esignable}">
                                <div class="p-0">
                                    <ui:insert name="esignHistory">EsignPanel</ui:insert>
                                </div>
                            </p:tab>
                        </p:tabView>
                    </p:outputPanel>
                </div>

                <div class="col-12 mt-1">
                    <div class="surface-section p-1 py-0 text-right border-top-1 surface-border">
                        <p:outputLabel
                                id="id-copyright-info"
                                value="#{mainFrame.copyrightInfo}"
                                styleClass="text-sm text-500"/>
                        <br/>
                        <p:outputLabel
                                id="id-version"
                                value="#{mainFrame.version}"
                                styleClass="text-sm text-500"/>
                    </div>
                </div>

            </div>
        </div>



    </div>

    <ui:include src="../../dialogs/dlg-message-code.xhtml"/>
    <ui:include src="../../dialogs/dlg-message.xhtml"/>
    <ui:include src="../../dialogs/dlg-user-info.xhtml"/>

    <p:ajaxStatus onstart="PF('statusDialog').show()" onsuccess="PF('statusDialog').hide()"/>
    <p:dialog widgetVar="statusDialog" modal="true" draggable="false" closable="false" resizable="false"
              showHeader="false" appendTo="@(body)">
        <p:graphicImage url="/images/ajax-loader.gif"/>
    </p:dialog>

    <p:dialog widgetVar="statusDialogDownload" modal="true" draggable="false" closable="false" resizable="false"
              showHeader="false" appendTo="@(body)">
        <p:graphicImage url="/images/downloading.gif" width="80"/>
    </p:dialog>
    <script type="text/javascript">
        //<![CDATA[
        $(document).ready(function() {
            setTimeout(function() {
                $('#layout-main').removeClass('preload');
            }, 100);
        });
        //]]>
    </script>

</h:body>
</html>

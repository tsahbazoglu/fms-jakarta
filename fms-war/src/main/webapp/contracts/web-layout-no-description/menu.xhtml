<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<ui:composition 
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ui="jakarta.faces.facelets"
    xmlns:p="http://primefaces.org/ui"
    xmlns:mydinamic="http://java.sun.com/jsf/composite/mydinamic"
    xmlns:h="jakarta.faces.html">

    <mydinamic:myaccordion 
        id="id-fms-accordion"
        fmsupdate="#{updateAjaxMB.menuSelectForm}"
        rows="#{mainFrame.accordionItems}" 
        selectedFormInfo="#{mainFrame.selectedFormInfo}"
        myAction="#{mainFrame.selectForm}"
        myActionListener="#{mainFrame.myActionListener}"
        myOnPaneChange="#{mainFrame.myOnPaneChange}"
        />

    <p:commandButton value="Sistem" 
                     icon="pi pi-cog"
                     rendered="#{mainFrame.access}"
                     action="#{mainFrame.goToSystem}" 
                     styleClass="ui-button-outlined ui-button-secondary w-full mt-2 p-button-sm"
                     update="#{updateAjaxMB.menuSelectForm}"
                     />
</ui:composition>

<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <h:head>
        <f:facet name="first">
            <meta http-equiv="X-UA-Compatible" content="IE=edge" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0" />
            <title>PrimeFaces 15 Responsive Admin</title>
        </f:facet>

        <h:outputStylesheet library="webjars" name="primeflex/3.3.1/primeflex.min.css" />

        <style>
            :root {
                --sidebar-width: 250px;
            }
            body {
                margin: 0;
                background-color: var(--surface-ground);
                font-family: var(--font-family);
            }

            .layout-topbar {
                height: 60px;
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                z-index: 1000;
            }
            .layout-sidebar {
                width: var(--sidebar-width);
                height: 100vh;
                position: fixed;
                top: 60px;
                left: 0;
                border-right: 1px solid var(--surface-border);
            }
            .layout-content {
                margin-left: var(--sidebar-width);
                padding-top: 60px;
                transition: margin-left .2s;
            }

            /* Mobile Adjustments */
            @media screen and (max-width: 768px) {
                .layout-sidebar {
                    display: none;
                }
                .layout-content {
                    margin-left: 0;
                }
            }
        </style>
    </h:head>

    <h:body>
        <h:form id="mainForm">
            <div class="layout-topbar bg-primary text-primary-contrast flex align-items-center px-4 shadow-2">
                <p:commandLink onclick="PF('mobileSidebar').show()" styleClass="md:hidden mr-3">
                    <i class="pi pi-bars text-white text-2xl"></i>
                </p:commandLink>

                <span class="text-xl font-bold">FMS SYSTEM</span>

                <div class="ml-auto">
                    <p:avatar icon="pi pi-user" shape="circle" styleClass="bg-primary-reverse" />
                </div>
            </div>

            <div class="layout-sidebar surface-section hidden md:block">
                <p:menu styleClass="w-full border-none">
                    <p:submenu label="Navigation">
                        <p:menuitem value="Dashboard" icon="pi pi-home" />
                        <p:menuitem value="Reports" icon="pi pi-file-pdf" />
                    </p:submenu>
                    <p:submenu label="Management">
                        <p:menuitem value="Users" icon="pi pi-users" />
                        <p:menuitem value="Settings" icon="pi pi-cog" />
                    </p:submenu>
                </p:menu>
            </div>

            <p:sidebar widgetVar="mobileSidebar" position="left" baseZIndex="10000">
                <h2 class="mt-0">Menu</h2>
                <p:menu styleClass="w-full border-none">
                    <p:menuitem value="Dashboard" icon="pi pi-home" oncomplete="PF('mobileSidebar').hide()" />
                    <p:menuitem value="Reports" icon="pi pi-file-pdf" oncomplete="PF('mobileSidebar').hide()" />
                    <p:menuitem value="Settings" icon="pi pi-cog" oncomplete="PF('mobileSidebar').hide()" />
                </p:menu>
            </p:sidebar>

            <div class="layout-content p-3 md:p-5">
                <div class="grid">

                    <div class="col-12 md:col-4">
                        <div class="surface-card p-4 shadow-1 border-round border-left-3 border-blue-500">
                            <div class="text-500 font-medium mb-2">Total Sales</div>
                            <div class="text-900 font-bold text-2xl">$2,400</div>
                        </div>
                    </div>
                    <div class="col-12 md:col-4">
                        <div class="surface-card p-4 shadow-1 border-round border-left-3 border-green-500">
                            <div class="text-500 font-medium mb-2">Active Sessions</div>
                            <div class="text-900 font-bold text-2xl">342</div>
                        </div>
                    </div>
                    <div class="col-12 md:col-4">
                        <div class="surface-card p-4 shadow-1 border-round border-left-3 border-orange-500">
                            <div class="text-500 font-medium mb-2">Pending Alerts</div>
                            <div class="text-900 font-bold text-2xl">12</div>
                        </div>
                    </div>

                    <div class="col-12 mt-4">
                      
                    </div>
                </div>
            </div>
        </h:form>
    </h:body>
</html>

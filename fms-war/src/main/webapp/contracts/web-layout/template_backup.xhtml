<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="http://primefaces.org/ui"
      >

    <h:head>
        <!--
        FIXME:
        these js had been placed here because of re-inserting at each ajax renderer issue
        have a look to mygrid.xhtml for more detail
        -->
        <f:facet name="first">
            <meta http-equiv="X-UA-Compatible" content="IE=Edge" /> 
            <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=0.8,maximum-scale=1.0, user-scale=0"/>
            <!--            <meta name="viewport" content="width=device-width, initial-scale=1.0,maximum-scale=1.0, user-scale=0"/>-->
            <meta name="apple-mobile-web-app-status-bar-style" content="yes"/> 
        </f:facet>

        <h:outputScript  name="js/fms-core.js" library="web-layout"/>


        <title><ui:insert name="title">#{mainFrame.companyTitle}</ui:insert></title>

        <h:outputStylesheet  name="css/noneie.css" library="web-layout"/>

        <script src="./resources/telmangrid/handsontable/handsontable.full.js"/>
        <link rel="stylesheet" media="screen" href="./resources/telmangrid/handsontable/handsontable.full.css"/>
        <link rel="stylesheet" media="screen" href="./resources/telmangrid/handsontable/fms.handsontable.override.css"/>
        <script type="text/javascript" src="./resources/telmangrid/handsontable/init3dHandson.v1.js"/>

        <h:outputStylesheet  name="css/fms-core.css" library="web-layout"/>
        <style>
            *{
                box-sizing: border-box;
                padding: 0;
                margin: 0;
            }
            .ui-tabs .ui-tabs-panel{
                padding:0!important;
            }
        </style>
    </h:head>

    <h:body>
        <p:panel style="width:100%;height: 100vh;">
            <div class="ui-g">
                <div class="ui-g-12 ui-md-12 ui-lg-3">
                    <h:form id="iceformTop">
                        <ui:include src="top.xhtml"/>
                    </h:form>
                    <br/>
                    <h:form> 
                        <ui:include src="menu.xhtml"/> 
                    </h:form> 
                </div>
                <div class="ui-g-12 ui-md-12 ui-lg-9">
                    <p:outputPanel id="idCenterCenter">

                        <p:outputPanel id="id-dlgs">
                            <ui:insert name="form-pop-ups">define form-pop-ups</ui:insert>
                        </p:outputPanel>

                        <p:outputPanel id="idCenterTop">
                            <ui:insert name="action-panel">define action-panel</ui:insert>
                        </p:outputPanel>

                        <p:tabView id="id-tab-view">
                            <p:tab id="id-tab-data-input" title="Veriler">
                                <p:panelGrid
                                    id="idContentObjectList"
                                    columns="#{mainFrame.position}" 
                                    columnClasses="#{mainFrame.positionStyle}"
                                    style="width: 100%;"
                                    layout="grid"
                                    >
                                    <p:outputPanel>
                                        <p:outputLabel 
                                            value="Veri Girişi" 
                                            style="font-weight: bold;"
                                            rendered="#{mainFrame.historyRendered}"
                                            title="güncellenebilir veriler bu sekmede yer almaktadır"
                                            />
                                        <p:separator rendered="#{mainFrame.historyRendered}"/>   

                                        <ui:insert name="current-content">define current-content</ui:insert>
                                    </p:outputPanel>
                                    <p:outputPanel rendered="#{mainFrame.historyRendered}">
                                        <p:outputLabel 
                                            value="Tüm Veriler"
                                            style="font-weight: bold;"
                                            title="tüm veriler bu sekmede yer almaktadır"
                                            />
                                        <p:separator/>    
                                        <ui:insert name="history-content">define history-content</ui:insert>
                                    </p:outputPanel>
                                </p:panelGrid>
                            </p:tab>
                            <p:tab id="id-tab-attachments" 
                                   title="Ekli Dosyalar" 
                                   rendered="#{formService.myForm.hasAttachedFiles}">   
                                <p:outputPanel>
                                    <ui:insert name="upload-page">define upload-page</ui:insert>
                                </p:outputPanel>
                            </p:tab>
                            <p:tab id="id-tab-esign" title="E-İmzalı Bildirimler" rendered="#{formService.myForm.esignable}">
                                <p:panelGrid
                                    id="id_eimza"
                                    columns="1"
                                    style="width: 100%;"
                                    >
                                    <h:panelGroup
                                        rendered="#{formService.myForm.esignable}"
                                        >
                                        <ui:insert name="esignHistory">EsignPanel</ui:insert>
                                    </h:panelGroup>
                                </p:panelGrid>
                            </p:tab>
                        </p:tabView>
                    </p:outputPanel> 
                </div>

                <div class="ui-g-12 ui-md-12 ui-lg-12">
                    <p:panel style="width:100%;text-align: right;">
                        <p:outputLabel value="#{mainFrame.copyrightInfo}"/>
                    </p:panel>
                </div>

            </div>
        </p:panel>

        <ui:include src="../../dialogs/dlg-message-code.xhtml"/>
        <ui:include src="../../dialogs/dlg-message.xhtml"/>
        <ui:include src="../../dialogs/dlg-user-info.xhtml"/>

        <p:ajaxStatus onstart="PF('statusDialog').show()" onsuccess="PF('statusDialog').hide()"/>
        <p:dialog 
            id="idStatusDialog"
            widgetVar="statusDialog" 
            modal="true" 
            draggable="false" 
            closable="false" 
            resizable="false" 
            showHeader="false">
            <p:graphicImage  url="/images/ajax-loader.gif"/>
        </p:dialog> 

        <p:dialog 
            id="idStatusDialogDownload"
            modal="true" 
            widgetVar="statusDialogDownload"
            draggable="false"
            closable="false" 
            resizable="false"
            showHeader="false">
            <p:graphicImage url="/images/downloading.gif" width="80px;"/>
        </p:dialog>

    </h:body>
</html>

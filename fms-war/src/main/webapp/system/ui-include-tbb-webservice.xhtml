<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:p="http://primefaces.org/ui"
      >

    <h:head>
        <title></title>
    </h:head>

    <p:outputPanel id="id-tbb-web-service">
        <br/>
        <p:outputLabel value="#{msg['turkiye.bankalar.birligi.tbb.web']}" style="font-size: 16px;font-weight: bolder"/>
        <br/>
        <br/>
        <h:panelGrid 
            columns="2"
            style="width: 100%;"
            class="webservice"
            >

            <p:outputLabel value="#{msg['web.service.url']}"/>
            <p:outputLabel value="#{tbbService.tbbWebServiceUrl}"/>

            <p:outputLabel value="#{msg['web.client.get.bank.ids']}"/>
            <h:form>
                <p:commandButton 
                    value="#{msg['calistir']}" 
                    action="#{tbbService.tbbWebServiceGetIds}" 
                    />
            </h:form>   

            <p:outputLabel value="#{msg['web.client.get.bank.details']}"/>
            <h:form id="uys_system_form">
                <p:commandButton 
                    value="#{msg['calistir']}" 
                    action="#{tbbService.runGetBankDetails}" 
                    />
            </h:form>

            <p:outputLabel value="#{msg['dosya.secimi.home.telman.desktop']}"/>
            <h:form enctype="multipart/form-data">
                <p:fileUpload 
                    id="idBankalarPath" 
                    listener="#{tbbService.upload}" 
                    style="width: 95%;"  
                    />
            </h:form>

            <p:outputLabel value="#{msg['tbb.tspb.banka.eslestirme.tablosunu']}"/>
            <h:form>
                <p:commandButton 
                    value="#{msg['calistir']}" 
                    action="#{tbbService.storeBanksToDb}" 
                    />
            </h:form>

            <p:outputLabel value="#{msg['detayli.eslestirme.yonetim.kurulu.ust']}"/>
            <h:form>
                <p:commandButton 
                    value="#{msg['calistir']}" 
                    action="#{tbbService.mergeWithTBB}" 
                    />
            </h:form>
        </h:panelGrid>
        <br/>
        <br/>
        <p:commandButton 
            value="#{msg['temizle']}" 
            action="#{tbbService.clearWarnings}" 
            style="white-space: nowrap;"
            rendered="true"
            />
        <br/>
        <br/>
        <p:dataList 
            value="#{tbbService.warnings}" 
            var="x" 
            id="idWarningList"
            lazy="true"
            >
            <h:outputText value="#{x}"/>
        </p:dataList>
    </p:outputPanel>
</html>

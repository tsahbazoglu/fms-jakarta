<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:p="http://primefaces.org/ui">

    <h:head>
        <title></title>
    </h:head>

    <h:body>
        <br/>
        <p:outputLabel value="#{msg['aciklama']}" style="font: bold normal 15px/20px arial,sans-serif;"/>
        <br/>
        <br/>
        <p:panel>
            <p:outputLabel
                value="#{msg['yuklenen.dosyalar.sistem.tarafinda.muhafiza']}"
                />
            <br/>
            <p:outputLabel
                value="#{msg['dosya.araciligi.ile.aktarim.sonrasinda']}"
                />
        </p:panel>
        <br/>
        <br/>
        <br/>
        <p:outputLabel value="#{msg['ornek.excell.dosya']}" style="font: bold normal 15px/20px arial,sans-serif;"/>
        <br/>
        <br/>
        <p:panel>
            <p:linkButton 
                icon="pi pi-download"
                value="#{msg['i.ndir']}"
                href="#{application.contextPath}/fmsdownload/gayrimenkul-yatirim-ortakliklari-net-aktif-deger-ve-varlik-degeri-v1.xlsx"
                >
            </p:linkButton>  
        </p:panel>
        <br/>
        <br/>
        <br/>
        <p:outputLabel value="#{msg['dosya.secimi']}" style="font: bold normal 15px/20px arial,sans-serif;"/>
        <br/>
        <br/>
        <h:form id="idInputFileForm" enctype="multipart/form-data">
            <p:fileUpload 
                listener="#{fmsMultiFormBulkUpload.uploadExcell}"
                invalidSizeMessage="Dosya Boyutu 4MB dan büyük olmamalı"
                invalidFileMessage="#{fmsMultiFormBulkUpload.invalidFileMessage}"
                fileLimitMessage="En fazla #{fmsMultiFormBulkUpload.fileLimit} dosya eklenebilir."
                fileLimit="#{fmsMultiFormBulkUpload.fileLimit}"
                cancelLabel="Vazgeç"
                uploadLabel="Yükle"
                label="#{msg['sec']}"
                allowTypes="/(\.|\/)(xlsx)$/"
                mode="advanced" 
                update="@this,#{updateAjaxMB.msgDlg}"
                />  
            <br/>
            <br/>
            <br/>
            <p:outputLabel value="#{msg['veri.tabanina.aktarim']}" style="font: bold normal 15px/20px arial,sans-serif;"/>
            <br/>
            <br/>
            <p:commandButton
                value="#{msg['aktarimi.baslat']}"
                action="#{fmsMultiFormBulkUpload.localBulkLoadExcell}"
                update="#{updateAjaxMB.msgDlg}"
                />
        </h:form>
    </h:body>
</html>

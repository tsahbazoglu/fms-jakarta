<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:f="jakarta.faces.core"
      xmlns:h="jakarta.faces.html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:c="jakarta.tags.core"
      xmlns:mydynamic="http://java.sun.com/jsf/composite/mydinamic"
      xmlns:mygrid="http://java.sun.com/jsf/composite/telmangrid"
      xmlns:ui="jakarta.faces.facelets">

    <h:head>
        <title></title>
    </h:head>

    <p:growl 
        showDetail="true"
        showSummary="true"
        keepAlive="true"
        life="3000">
        <p:autoUpdate/>
    </p:growl>

    <br/>

    <p:toolbar
        id="id-2d-wf-toolbar"
        style="width: 100%;"
        >
        <f:facet name="left">
            <ui:include src="ui-workflow-btn.xhtml"/>
        </f:facet>   
        <f:facet name="right">
            <p:outputLabel value="adım : #{twoDimModifyCtrl.myObject['smState']}"/>
        </f:facet>
    </p:toolbar>

    <br/>

    <p:dataTable
        id="id-dt-wf"
        value="#{workFlowCtrl.history}" 
        var="history"
        >
        <f:facet name="header">
            <h:outputText value="İş Akış Tarihçesi"/>
        </f:facet>
        <c:forEach items="#{workFlowCtrl.fieldsAsList}" var="myField">
            <p:column headerText="#{myField.label}">
                <h:outputText value="#{history[myField.key]}"/>
            </p:column>
        </c:forEach>
    </p:dataTable>

    <br/>

</html>

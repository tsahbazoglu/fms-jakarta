<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
      xmlns:f="http://xmlns.jcp.org/jsf/core">




    <h:form id="id-form-childs">

        <div class="ui-g">
            <div class="ui-g-12">
                <p:commandButton 
                    value="ekle" 
                    styleClass="ui-priority-primary"
                    action="#{twoDimModifyCtrl.onAddNew}" 
                    rendered="#{not empty formService.myForm.childFields and formService.myForm.childAdd}"
                    />
            </div>
        </div>

        <p:dataTable 
            id="id-dt-childs" 
            widgetVar="wvDataTableChilds" 
            var="rowData" 
            value="#{twoDimModifyCtrl.childRecords}"
            style="margin:5px;width: 90%"
            rendered="#{not empty formService.myForm.childFields}"
            selectionMode="single" 
            selection="#{twoDimModifyCtrl.selectedChildRow}" 
            rowKey="#{rowData['rowKey']}"  
            emptyMessage="veri girişi bulunmamaktadır"
            >

            <c:forEach items="#{twoDimModifyCtrl.childFields}" var="field">
                <p:column headerText="#{field.name}" rendered="#{field.componentType == 'inputDate'}">
                    <h:outputText  
                        style="#{field.style}"
                        value="#{rowData[field.field]}"
                        converter="fmsDateTimeConverterReadonly"
                        >
                        <f:attribute name="datePattern" value="#{field.datePattern}"/>
                    </h:outputText>
                </p:column> 
                <p:column headerText="#{field.name}" rendered="#{field.componentType == twoDimModifyCtrl.selectOneRadio}">
                    <h:outputText 
                        style="#{field.style}"
                        value="#{rowData[field.field]}"
                        converter ="#{field.myconverter}"     
                        >
                        <f:attribute name="converterInstance" value="#{field.converterInstance}"/>
                        <f:attribute name="minFractationDigits" value="#{field.minFractationDigits}"/>
                        <f:attribute name="maxFractationDigits" value="#{field.maxFractationDigits}"/>
                        <f:attribute name="divider" value="#{field.divider}"/>
                        <f:attribute name="fieldKey" value="#{field.fieldKey}"/>
                        <f:attribute name="crudObject" value="#{rowData}"/>
                        <f:attribute name="uysformat" value="#{field.uysformat}"/>

                        <f:attribute name="viewKey" value="#{field.viewKey}"/>
                        <f:attribute name="calculateOnView" value="#{field.calculateOnView}"/>
                        <f:attribute name="myField" value="#{field}"/>
                        <f:attribute name="converterFormat" value="#{field.converterFormat}"/>
                        <f:attribute name="sessionKey" value="#{field.sessionKey}"/>
                    </h:outputText>
                </p:column> 
                <p:column headerText="#{field.name}" rendered="#{field.componentType == twoDimModifyCtrl.selectOneMenu}">
                    <h:outputText 
                        style="#{field.style}"
                        value="#{rowData[field.field]}"
                        converter ="#{field.myconverter}"     
                        >
                        <f:attribute name="converterInstance" value="#{field.converterInstance}"/>
                        <f:attribute name="minFractationDigits" value="#{field.minFractationDigits}"/>
                        <f:attribute name="maxFractationDigits" value="#{field.maxFractationDigits}"/>
                        <f:attribute name="divider" value="#{field.divider}"/>
                        <f:attribute name="fieldKey" value="#{field.fieldKey}"/>
                        <f:attribute name="crudObject" value="#{rowData}"/>
                        <f:attribute name="uysformat" value="#{field.uysformat}"/>

                        <f:attribute name="viewKey" value="#{field.viewKey}"/>
                        <f:attribute name="calculateOnView" value="#{field.calculateOnView}"/>
                        <f:attribute name="myField" value="#{field}"/>
                        <f:attribute name="converterFormat" value="#{field.converterFormat}"/>
                        <f:attribute name="sessionKey" value="#{field.sessionKey}"/>
                    </h:outputText>
                </p:column> 
                <p:column headerText="#{field.name}" rendered="#{field.componentType == twoDimModifyCtrl.inputTextarea}">
                    <h:outputText 
                        style="#{field.style}"
                        value="#{rowData[field.field]}"
                        converter ="#{field.myconverter}"     
                        >
                        <f:attribute name="converterInstance" value="#{field.converterInstance}"/>
                        <f:attribute name="minFractationDigits" value="#{field.minFractationDigits}"/>
                        <f:attribute name="maxFractationDigits" value="#{field.maxFractationDigits}"/>
                        <f:attribute name="divider" value="#{field.divider}"/>
                        <f:attribute name="fieldKey" value="#{field.fieldKey}"/>
                        <f:attribute name="crudObject" value="#{rowData}"/>
                        <f:attribute name="uysformat" value="#{field.uysformat}"/>
                        <f:attribute name="viewKey" value="#{field.viewKey}"/>
                        <f:attribute name="calculateOnView" value="#{field.calculateOnView}"/>
                        <f:attribute name="myField" value="#{field}"/>
                        <f:attribute name="converterFormat" value="#{field.converterFormat}"/>
                        <f:attribute name="sessionKey" value="#{field.sessionKey}"/>
                    </h:outputText>
                </p:column> 
                <p:column headerText="#{field.name}" rendered="#{field.componentType == twoDimModifyCtrl.inputText}">
                    <h:outputText 
                        style="#{field.style}"
                        value="#{rowData[field.field]}"
                        converter ="#{field.myconverter}"     
                        >
                        <f:attribute name="converterInstance" value="#{field.converterInstance}"/>
                        <f:attribute name="minFractationDigits" value="#{field.minFractationDigits}"/>
                        <f:attribute name="maxFractationDigits" value="#{field.maxFractationDigits}"/>
                        <f:attribute name="divider" value="#{field.divider}"/>
                        <f:attribute name="fieldKey" value="#{field.fieldKey}"/>
                        <f:attribute name="crudObject" value="#{rowData}"/>
                        <f:attribute name="uysformat" value="#{field.uysformat}"/>
                        <f:attribute name="viewKey" value="#{field.viewKey}"/>
                        <f:attribute name="calculateOnView" value="#{field.calculateOnView}"/>
                        <f:attribute name="myField" value="#{field}"/>
                        <f:attribute name="converterFormat" value="#{field.converterFormat}"/>
                        <f:attribute name="sessionKey" value="#{field.sessionKey}"/>
                    </h:outputText>
                </p:column> 
                <p:column headerText="#{field.name}" rendered="#{field.componentType == twoDimModifyCtrl.inputNumber}">
                    <h:outputText 
                        style="#{field.style}"
                        value="#{rowData[field.field]}"
                        converter ="#{field.myconverter}"     
                        >
                        <f:attribute name="converterInstance" value="#{field.converterInstance}"/>
                        <f:attribute name="minFractationDigits" value="#{field.minFractationDigits}"/>
                        <f:attribute name="maxFractationDigits" value="#{field.maxFractationDigits}"/>
                        <f:attribute name="divider" value="#{field.divider}"/>
                        <f:attribute name="fieldKey" value="#{field.fieldKey}"/>
                        <f:attribute name="crudObject" value="#{rowData}"/>
                        <f:attribute name="uysformat" value="#{field.uysformat}"/>
                        <f:attribute name="viewKey" value="#{field.viewKey}"/>
                        <f:attribute name="calculateOnView" value="#{field.calculateOnView}"/>
                        <f:attribute name="myField" value="#{field}"/>
                        <f:attribute name="converterFormat" value="#{field.converterFormat}"/>
                        <f:attribute name="sessionKey" value="#{field.sessionKey}"/>
                    </h:outputText>
                </p:column> 
                <p:column headerText="#{field.name}" rendered="#{field.componentType == twoDimModifyCtrl.inputMask}">
                    <h:outputText 
                        style="#{field.style}"
                        value="#{rowData[field.field]}"                    
                        converter ="#{field.myconverter}"     
                        >
                        <f:attribute name="converterInstance" value="#{field.converterInstance}"/>
                        <f:attribute name="minFractationDigits" value="#{field.minFractationDigits}"/>
                        <f:attribute name="maxFractationDigits" value="#{field.maxFractationDigits}"/>
                        <f:attribute name="divider" value="#{field.divider}"/>
                        <f:attribute name="fieldKey" value="#{field.fieldKey}"/>
                        <f:attribute name="crudObject" value="#{rowData}"/>
                        <f:attribute name="uysformat" value="#{field.uysformat}"/>

                        <f:attribute name="viewKey" value="#{field.viewKey}"/>
                        <f:attribute name="calculateOnView" value="#{field.calculateOnView}"/>
                        <f:attribute name="myField" value="#{field}"/>
                        <f:attribute name="converterFormat" value="#{field.converterFormat}"/>
                        <f:attribute name="sessionKey" value="#{field.sessionKey}"/>
                    </h:outputText>
                </p:column> 
                <p:column headerText="#{field.name}" rendered="#{field.componentType == twoDimModifyCtrl.autoComplete}">
                    <h:outputText 
                        style="#{field.style}"
                        value="#{rowData[field.field]}"                  
                        converter ="#{field.myconverter}"     
                        >
                        <f:attribute name="converterInstance" value="#{field.converterInstance}"/>
                        <f:attribute name="minFractationDigits" value="#{field.minFractationDigits}"/>
                        <f:attribute name="maxFractationDigits" value="#{field.maxFractationDigits}"/>
                        <f:attribute name="divider" value="#{field.divider}"/>
                        <f:attribute name="fieldKey" value="#{field.fieldKey}"/>
                        <f:attribute name="crudObject" value="#{rowData}"/>
                        <f:attribute name="uysformat" value="#{field.uysformat}"/>
                        <f:attribute name="viewKey" value="#{field.viewKey}"/>
                        <f:attribute name="calculateOnView" value="#{field.calculateOnView}"/>
                        <f:attribute name="myField" value="#{field}"/>
                        <f:attribute name="converterFormat" value="#{field.converterFormat}"/>
                        <f:attribute name="sessionKey" value="#{field.sessionKey}"/>
                    </h:outputText>
                </p:column>
            </c:forEach>

            <p:ajax 
                event="rowSelect" 
                disabled="#{not (mainFrame.isTwoDim and formService.myForm.myActions.save)}"
                listener="#{twoDimModifyCtrl.selectChildListener}"
                update="id-dlg-child-row-edit"
                partialSubmit="true"
                process="@this,idTwoDlgTabView:crud2dForm:crud_2d_dlg_panel"
                />

        </p:dataTable>

    </h:form>





</html>

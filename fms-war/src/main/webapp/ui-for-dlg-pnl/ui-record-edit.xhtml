<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:ui="jakarta.faces.facelets">

    <h:inputHidden id="id-status-data-change" value="false"/>

    <script type="text/javascript">
        //<![CDATA[
        var dlg_close_span = $("#idCrudOperation .ui-icon-closethick");

        if (#{formService.myForm.myActions.save}) {
            dlg_close_span.off("click.crudClose").on("click.crudClose", openAnotherPopup);

            var form = $(document.getElementById("idTwoDlgTabView:crud2dForm"));
            form.off("change.crudChange").on("change.crudChange", function () {
                truechange();
            });
            form.off("keyup.crudKeyup").on("keyup.crudKeyup", function (e) {
                if (e.which != 27) {
                    truechange();
                }
            });
        }

        $(document).off("keydown.crudEscape").on("keydown.crudEscape", function (e) {
            if (e.which === 27 || e.key === "Escape") {
                if (e.isDefaultPrevented()) {
                    return;
                }
                var $crud = $("#idCrudOperation");
                if (!$crud.length || !$crud.is(":visible")) {
                    return;
                }
                var crudWidget = typeof PF === "function" ? PF("crudOperationDialog2") : null;
                if (crudWidget && !crudWidget.isVisible()) {
                    return;
                }
                // If messageDialog is visible, it is on top of idCrudOperation - do not close idCrudOperation
                var msgWidget = typeof PF === "function" ? PF("messageDialog") : null;
                if (msgWidget && msgWidget.isVisible()) {
                    return;
                }
                if ($("#idMessageDialog").is(":visible")) {
                    return;
                }
                // Check if any other visible dialog or overlay has a higher z-index (i.e. is on top of idCrudOperation)
                var crudZ = parseInt($crud.css("z-index")) || 0;
                var hasTopDialog = false;
                $(".ui-dialog:visible").each(function () {
                    if (this.id !== "idCrudOperation") {
                        var z = parseInt($(this).css("z-index")) || 0;
                        if (z >= crudZ) {
                            hasTopDialog = true;
                            return false;
                        }
                    }
                });
                if (hasTopDialog) {
                    return;
                }
                $(".ui-widget-overlay:visible").each(function () {
                    var z = parseInt($(this).css("z-index")) || 0;
                    if (z >= crudZ) {
                        hasTopDialog = true;
                        return false;
                    }
                });
                if (hasTopDialog) {
                    return;
                }

                e.preventDefault();
                e.stopPropagation();
                if (typeof openAnotherPopup === "function" && #{formService.myForm.myActions.save}) {
                    openAnotherPopup();
                } else if (dlg_close_span.length) {
                    dlg_close_span.click();
                } else if (crudWidget) {
                    crudWidget.hide();
                }
            }
        });
        //]]>
    </script>

    <script type="text/javascript">
        //<![CDATA[
        $(document).on("input change keyup", "[id*='id-component-completionPercentage'] input, [id*='id-component-CompletionPercentage'] input, [id*='id-component-completion_percentage'] input, [id*='id-component-complete'] input, [id*='id-component-Complete'] input, input[id*='completionPercentage'], input[id*='completion_percentage']", function () {
            var raw = $(this).val();
            if (raw !== undefined && raw !== null) {
                var cleaned = raw.toString().replace("%", "").trim();
                var val = parseFloat(cleaned);
                if (!isNaN(val)) {
                    if (val > 0 && val < 1.0 || (val <= 1.0 && cleaned.indexOf(".") !== -1)) {
                        val = val * 100;
                    }
                    val = Math.max(0, Math.min(100, Math.round(val)));
                    if (typeof PF === 'function' && PF('wvRecordProgressBar')) {
                        PF('wvRecordProgressBar').setValue(val);
                    }
                    var $pb = $("[id$='id-progress-bar-complete']");
                    $pb.find(".ui-progressbar-value").css("width", val + "%");
                    $pb.find(".ui-progressbar-label").text(val + "%");
                    $pb.attr("title", val + "%");
                }
            }
        });
        //]]>
    </script>

    <p:tabView id="idTwoDlgTabView">
        <p:tab 
            title="#{msg['veri.girisi']}"
            >
            <ui:include src="ui-crud.xhtml"/>
        </p:tab>
        <p:tab 
            title="#{msg['veri.kalemleri']}"
            rendered="#{formService.myForm.hasChildFields}"
            >
            <!--<ui:include src="ui-crud-childs-data-table-inline.xhtml"/>-->
            <ui:include src="ui-crud-childs-data-table-popup.xhtml"/>
        </p:tab>
        <p:tab 
            title="#{msg['ekli.dosyalar']}"
            rendered="#{formService.myForm.hasAttachedFiles}"
            >
            <ui:include src="ui-upload.xhtml"/>
        </p:tab>
        <p:tab 
            title="#{msg['veri.tarihcesi']}"
            rendered="#{formService.myForm.versionEnable}"
            >
            <ui:include src="ui-version-history.xhtml"/>
        </p:tab>
        <p:tab 
            title="#{msg['i.s.sureci']}"
            rendered="#{formService.myForm.workFlowActive}"
            >
            <ui:include src="ui-workflow.xhtml"/>
        </p:tab>   
        <p:tab 
            title="#{msg['e.posta.bildirimler']}" 
            rendered="#{formService.myForm.myActions.email}">

            <ui:include src="../ui-for-dlg-pnl/ui-email-preview.xhtml"/>     

        </p:tab>

    </p:tabView>
</html>

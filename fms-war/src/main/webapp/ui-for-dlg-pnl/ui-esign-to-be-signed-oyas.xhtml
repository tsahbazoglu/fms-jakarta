<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html
    PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:f="jakarta.faces.core" xmlns:h="jakarta.faces.html"
    xmlns:p="http://primefaces.org/ui">
<script>
    async function checkEsignReady() {
        try {
            const myHeaders = new Headers();
            myHeaders.append("Accept", "*/*");
            const requestOptions = {
                method: "GET",
                headers: myHeaders,
                redirect: "follow"
            };
            const res = await fetch("http://localhost:9090/ready", requestOptions);
            const text = await res.text();
            return text.trim() === 'Ready';
        } catch (error) {
            console.error('Error checking e-sign ready status:', error);
            return false;
        }
    }

    async function signB64(signatureId, base64String) {
        try {
            if (!base64String) {
                alert('İmzalanacak içerik bulunamadı.');
                return null;
            }
            const myHeaders = new Headers();
            const enterPin = document.getElementById('id-tab-view:imzform:pinInput').value; // prompt('E-imza PIN kodunuzu girin:');
            if (!enterPin) {
                alert('Lütfen PIN kodunuzu girin.');
                return null;
            }
            myHeaders.append("PIN", enterPin);
            myHeaders.append("Content-Type", "application/json");
            myHeaders.append("Accept", "*/*");
            const raw = JSON.stringify({
                "documentType": "DOCUMENT",
                "digestAlgorithm": "SHA256",
                "signatureType": "CAdES",
                "signaturePackaging": "ENVELOPING",
                "document": base64String,
                "signatureId": signatureId
            });
            const requestOptions = {
                method: "POST",
                headers: myHeaders,
                body: raw,
                redirect: "follow"
            };
            const res = await fetch("http://localhost:9090/sign", requestOptions);
            const json = await res.json();
            return json;
        } catch (error) {
            return {
                error: 'E-imza imzalama işlemi sırasında bir hata oluştu: ' + error.message
            };
        }

    }
    async function handleEsignWithApi() {
        if (!await checkEsignReady()) {
            alert('E-imza hazır değil. Lütfen e-imza uygulamasını başlatın ve tekrar deneyin.');
            return;
        }
        var toBeSignedFileBase64String = document.getElementById('id-tab-view:imzform:toBeSignedFileBase64String').value;
        var signatureId = document.getElementById('id-tab-view:imzform:crudObjectTextViewerID').value;
        const signResult = await signB64(signatureId, toBeSignedFileBase64String);
        if (!signResult || !signResult.signedDocument) {
            const errorMessage = 'İmzalama işlemi basarısız oldu: ' + (signResult.error || 'Bilinmeyen hata');
            alert(errorMessage);
            return null;
        } else {
            const signedDocumentBase64 = signResult.signedDocument;
            sendSignedDocToBean([
                { name: 'signedDoc', value: signedDocumentBase64 }
            ]);
            alert('İmzalama işlemi başarılı!');
            PF('poll').start();
        }
    }

</script>

<!--<h:form id="imzform" enctype="application/x-www-form-urlencoded">-->
<!--<h:form id="imzform" enctype="multipart/form-data">-->
<h:form id="imzform">
    <p:toolbar>
        <f:facet name="left">
            <h:inputHidden id="toBeSignedFileBase64String" value="#{esignController.toBeSignedFileBase64String}" />
            <h:inputHidden id="crudObjectTextViewerID" value="#{esignController.crudObjectTextViewerID}" />
            <p:remoteCommand name="sendSignedDocToBean" action="#{esignController.processSignedDocument}" />
            <p:linkButton href="#" onclick="handleEsignWithApi();return false;" style="font-size: 20px;" value="İmzala"
                icon="fa fa-barcode">
            </p:linkButton>

            <p:commandButton value="Elektronik imzalamadan bildirim yap" id="id_btn_justNotify"
                rendered="#{esignController.canNotifyWithoutEsign}" action="#{esignController.justNotifyWithoutEsign}"
                update="#{updateAjaxMB.btnNotifyWoEsing}">
            </p:commandButton>
        </f:facet>

        <f:facet name="right">
            <p:button value="Eimza Kurulumu" onclick="PrimeFaces.widgets['wv-esign-install-info'].show();return;">
            </p:button>
        </f:facet>
    </p:toolbar>

    <h:panelGroup>
        <h:outputText value="Döküman Bilgisi" style="font-size: 22px;font-weight: bolder;color: #b3b3b3;"
            rendered="false" />
        <h:outputText value="#{esignController.crudObjectTextViewerID}" style="font-size: 14px;color: #b3b3b3;" />

        <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank ui-fluid"
            columnClasses="ui-grid-col-4, ui-grid-col-8" style="margin: 20px auto;">

            <p:outputLabel for="pinInput" value="E-imza PIN Kodu:" style="font-weight: bold;" />

            <h:panelGroup styleClass="ui-inputgroup">
                <span class="ui-inputgroup-addon"><i class="pi pi-lock"></i></span>
                <p:password id="pinInput" autocomplete="new-password" value="#{esignController.pinCode}" feedback="false" toggleMask="true"
                    required="true" />
            </h:panelGroup>

        </p:panelGrid>
        <p:dataTable value="#{esignController.signedDocContentFields}" var="mymap">
            <p:column>
                <f:facet name="header">Alan</f:facet>
                <h:outputText value="#{mymap.key}" />
            </p:column>
            <p:column>
                <f:facet name="header">Değer</f:facet>
                <h:outputText value="#{mymap.value}" />
            </p:column>
        </p:dataTable>
        <!--
                                     regardning to 1.2.0.CR1 applet version no need any more to put content in inputHidden text
                                     content will be directly retrieved  from server 
                                     <h:inputHidden id="sourcedoc" value="# {esignController.crudObjectTextViewer}"></h:inputHidden>
            -->
        <div id="signresult"></div>
        <h:inputHidden id="imz" value="#{esignController.imz64}" />
        <p:commandButton value="Direk İmzala" id="buttonEimzaOK" action="#{esignController.esign}"
            style="display: none;"
            rendered="#{mainFrame.currEnumPage ne 'GENERAL_ND' and  formService.myForm.esignable}"
            update="id-tab-view:idToBeSignedDialog">
        </p:commandButton>
        <h:inputHidden id="sourcedocid" value="#{esignController.crudObjectTextViewerID}"></h:inputHidden>
        <!--action="# {crudOneDim.eimzala}" -->
    </h:panelGroup>
</h:form>

<h:form id="idMultiAjaxCollectorForm">
    <h:inputHidden id="imzCollectorIndex" value="#{esignController.esignChunkIndex}" />
    <h:inputHidden id="imzCollector" value="#{esignController.esignChunk}" />
    <p:commandButton id="buttonEimzaCollector" style="display: none;" action="#{esignController.esignCollector}"
        async="true" update="#{updateAjaxMB.msgDlg}" />
</h:form>

</html>

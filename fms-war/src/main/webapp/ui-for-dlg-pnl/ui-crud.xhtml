<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:f="jakarta.faces.core"
      xmlns:h="jakarta.faces.html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:c="jakarta.tags.core"
      xmlns:mydynamic="http://java.sun.com/jsf/composite/mydinamic"
      xmlns:mygrid="http://java.sun.com/jsf/composite/telmangrid"
      xmlns:ui="jakarta.faces.facelets">

    <p:outputPanel id="id-panel-crud">

        <p:messages 
            showDetail="true"
            closable="true">
            <p:autoUpdate/>
        </p:messages>

        <p:panel
            id="id-2d-toolbar"
            style="width: 100%;"
            >
            <p:panelGrid columns="12" layout="grid">
                <p:button  
                    icon="pi pi-home" 
                    disabled="true">
                </p:button>
                <p:button
                    icon="pi pi-save" 
                    onclick="rcSave();return false;"
                    title="Kaydet" 
                    rendered="#{mainFrame.isTwoDim and formService.myForm.myActions.save}"
                    />
                <p:button
                    icon="pi pi-clone" 
                    onclick="rcSaveAs();return false;"
                    title="Farklı Kaydet" 
                    rendered="#{mainFrame.isTwoDim and formService.myForm.myActions.saveAs}"
                    />  
                <p:commandButton 
                    icon="pi pi-trash" 
                    onclick="PF('specialConfirmationDialog').show(); return false;"
                    title="Sil" 
                    transient="true"
                    rendered="#{mainFrame.isTwoDim and formService.myForm.myActions.delete}"
                    />  
                <p:button 
                    icon="pi pi-reply" 
                    onclick="setToRelatedForm();return false;"
                    title="Aktar" 
                    transient="true"
                    rendered="#{mainFrame.hasSetToRelatedForm}"
                    /> 
                <p:commandButton 
                    id="id_2d_button_esign"
                    value="2:1 - Eimza Süreci" 
                    action="#{twoDimModifyCtrl.showEimza}" 
                    rendered="#{mainFrame.isTwoDim and formService.myForm.myActions.eimza1D}"
                    update="#{updateAjaxMB.btn2dDlgEsign}"
                    />
                <!--rendered="# {twoDimModifyCtrl.dependOnSelectedFormRenderedMap['save']and twoDimModifyCtrl.myObject['resultType']['code']=='001'}"-->
                <p:commandButton 
                    id="buttonCopyObject"
                    value="Kopyala" 
                    action="#{twoDimModifyCtrl.copyObject}" 
                    rendered="false"/>

                <p:commandButton 
                    value="Ödeme İşlemi" 
                    action="#{twoDimModifyCtrl.payment}" 
                    style="white-space: nowrap;"
                    update=":id-dlg-payment,#{updateAjaxMB.msgDlg}"
                    rendered="#{formService.myForm.myActions.payment}"
                    />

                <p:commandButton 
                    value="indirmek için tıklayınız." 
                    ajax="false" 
                    icon="ui-icon-arrowthick-1-s"
                    rendered="#{formService.myForm.myActions.pdf}"
                    >
                    <p:fileDownload value="#{twoDimModifyCtrl.file}"/>
                </p:commandButton>

                <p:commandButton 
                    value="LDAP" 
                    onclick="PF('wv_dlg_ldap').show(); return false;"
                    style="white-space: nowrap;"
                    update="id_dlg_ldap"
                    rendered="#{formService.myForm.myActions.ldap}"
                    >
                </p:commandButton>

                <h:outputText 
                    value="Tarihçe Etkin(siz)leştir" 
                    style="white-space: nowrap;"
                    rendered="#{roleMB[mainFrame.architectRole] and formService.myForm.myActions.save}"/>

                <h:selectBooleanCheckbox  
                    value="#{twoDimModifyCtrl.enableHistoryOnSave}" 
                    readonly="true"
                    rendered="#{roleMB[mainFrame.architectRole] and formService.myForm.myActions.save}"/>

                <c:forEach 
                    items="#{formService.myForm.myActions.list}" 
                    var="dynamicBtn"
                    rendered="#{formService.myForm.hasWorkflowRelation}"
                    >
                    <p:commandButton  
                        value="#{dynamicBtn.label}"
                        action="#{dynamicBtn.execute}"
                        immediate="true"
                        /> 
                </c:forEach>

                <ui:include src="ui-workflow-btn.xhtml"/>

                <p:outputLabel                     
                    rendered="#{roleMB[mainFrame.architectRole]}"
                    value="{_id : ObjectId('#{twoDimModifyCtrl.myObject['_id']}')}"/>

            </p:panelGrid>
        </p:panel>

        <p:scrollPanel 
            id="id-table-dlg-crud-scr-pnl"
            mode="native">

            <h:form id="crud2dForm">
                <p:outputPanel>
                    <p:remoteCommand                
                        name="rc_2d_delete"
                        value="Sormadan Sil"
                        action="#{twoDimModifyCtrl.deleteObject}" 
                        rendered="#{mainFrame.isTwoDim and formService.myForm.myActions.delete}"
                        update="#{updateAjaxMB.buttonDeleteDirectly}"
                        immediate="true"
                        /> 
                    <p:remoteCommand 
                        name="rcSave"
                        oncomplete="falsechange();"
                        value="Kaydet" 
                        action="#{twoDimModifyCtrl.saveObject}" 
                        rendered="#{mainFrame.isTwoDim and formService.myForm.myActions.save}"
                        update="#{updateAjaxMB.btn2dSave},:idTwoDlgTabView,id-tab-view:id-table-file-list"
                        />
                    <p:remoteCommand 
                        name="rcSaveAs"
                        value="Farklı Kaydet" 
                        oncomplete="falsechange();"
                        action="#{twoDimModifyCtrl.saveAsObject}" 
                        rendered="#{mainFrame.isTwoDim and formService.myForm.myActions.saveAs}"
                        update="#{updateAjaxMB.btn2dSave},:idTwoDlgTabView,id-tab-view:id-table-file-list"
                        />  
                    <p:remoteCommand 
                        name="setToRelatedForm"
                        value="ilgili forma aktar" 
                        action="#{mainFrame.setToRelatedForm(twoDimModifyCtrl.myObject._id)}" 
                        update="#{updateAjaxMB.idCenterMiddle}"
                        rendered="#{mainFrame.hasSetToRelatedForm}"
                        />
                </p:outputPanel>

                <p:panelGrid 
                    id="crud_2d_dlg_panel"
                    columns="3" 
                    layout="grid"
                    columnClasses="ui-g-3,ui-g-6,ui-g-3"
                    >
                    <c:forEach items="#{formService.myForm.fieldsAsList}" var="myField">

                        <p:outputPanel id="id-label-#{myField.key}" class="#{myField.styleClass}">
                            <p:outputLabel
                                value="#{myField.label}" 
                                escape="false"
                                style="#{myField.labelStyle}"
                                styleClass="medium-font-size"
                                rendered="#{myField.rendered}"
                                >
                            </p:outputLabel>
                            <p:spacer width="10" height="10"/>               
                            <p:commandButton 
                                value="Seç" 
                                style="font-size:8px;"
                                action="#{mainFrame.goToForm}"
                                update="#{updateAjaxMB.idCenterMiddle}"
                                rendered="#{myField.rendered and myField.hasHref}"
                                immediate="true"
                                >
                                <f:setPropertyActionListener value="#{myField.href}" target="#{mainFrame.fmsHref}"/>
                                <f:setPropertyActionListener value="#{twoDimModifyCtrl.myObject}" target="#{mainFrame.callBackCrud}"/>
                            </p:commandButton>
                        </p:outputPanel>

                        <p:outputPanel id="id-component-#{myField.key}" class="#{myField.styleClass}">
                            <c:if test="#{twoDimModifyCtrl.selectOneMenu eq  myField.componentType}">
                                <mydynamic:uysSelectMenuTable  
                                    myField="#{myField}"                                    
                                    id="daradam"
                                    myvalue="#{twoDimModifyCtrl.myObject[myField.key]}"
                                    myFieldKey="#{myField.key}"
                                    myProjectKey="#{formService.myForm.projectKey}"
                                    myUpperNode="#{formService.myForm.upperNode}"
                                    myFormKey="#{formService.myForm.key}"
                                    myreadonly="#{myField.readonly}" 
                                    label="#{myField.label}" 
                                    myitems="#{myField.selectItemsCurrent}" 
                                    myrequired="#{myField.required}"
                                    rendered="#{myField.rendered}"
                                    myconverter="#{myField.myconverter}"
                                    isAjax="#{myField.ajax.enable}"
                                    ajax_update="#{myField.ajaxUpdate}"
                                    someaction="#{twoDimModifyCtrl.someaction}"
                                    />
                            </c:if>

                            <c:if test="#{twoDimModifyCtrl.chips eq  myField.componentType}">
                                <mydynamic:fmsChips
                                    items="#{twoDimModifyCtrl.myObject[myField.key]}"
                                    imgsrc="/images/supplier.png"
                                    />
                            </c:if>

                            <p:autoComplete 
                                dropdown="true" 
                                value="#{twoDimModifyCtrl.myObject[myField.key]}" 
                                completeMethod="#{myField.completeMethod}"
                                readonly="#{myField.readonly}" 
                                rendered="#{twoDimModifyCtrl.autoComplete eq  myField.componentType and myField.rendered}"
                                converter="documentConverter"
                                var="item" 
                                itemLabel="#{item.name}"
                                itemValue="#{item}"
                                forceSelection="true"
                                minQueryLength="3"    
                                inputStyle="width:100%;"
                                >
                                <c:if test="#{myField.ajax.enable}">
                                    <f:attribute name="fieldKey" value="#{myField.key}"/>
                                    <p:ajax 
                                        event="itemSelect" 
                                        listener="#{twoDimModifyCtrl.someaction}" 
                                        update="#{myField.ajaxUpdate}"/>
                                </c:if>
                            </p:autoComplete>

                            <p:outputPanel
                                rendered="#{twoDimModifyCtrl.pickList eq  myField.componentType and myField.rendered}"
                                >
                                <p:panelGrid columns="3" layout="grid" columnClasses="ui-g-5,ui-g-2,ui-g-5">                                        <p:outputLabel value="eklenebilir_formlar" style="font-weight: bold;"/>
                                    <p:outputLabel value=" "/>
                                    <p:outputLabel value="eklenen_formlar" style="font-weight: bold;"/>
                                </p:panelGrid>
                                <p:pickList
                                    value="#{twoDimModifyCtrl.myObject[myField.key]}"
                                    var="relatedForms" 
                                    itemLabel="#{relatedForms}" 
                                    itemValue="#{relatedForms}"
                                    addAllLabel="Tümünü Ekle"
                                    addLabel="Ekle"
                                    removeAllLabel="Tümünü Çıkar"
                                    removeLabel="Çıkar"
                                    >
                                </p:pickList>
                            </p:outputPanel>

                            <mydynamic:uysSelectManyListbox 
                                myvalue="#{twoDimModifyCtrl.myObject[myField.key]}"
                                label="#{myField.label}" 
                                myitems="#{myField.selectItemsCurrent}" 
                                rendered="#{twoDimModifyCtrl.selectManyListbox eq  myField.componentType and myField.rendered}"
                                myconverter="#{myField.myconverter}"
                                />
                            <mydynamic:uysInputText 
                                myvalue="#{twoDimModifyCtrl.myObject[myField.key]}"
                                myFieldKey="#{myField.key}"
                                myreadonly="#{myField.readonly}" 
                                myrequired="#{myField.required}"
                                mystyle="#{myField.style};width:100%"
                                myCalculateOnCrudView="#{myField.calculateOnCrudView}"
                                myCalculateOnListView="#{myField.calculateOnListView}"
                                myCalculateOnSave="#{myField.calculateOnSave}"
                                label="#{myField.label}" 
                                rendered="#{twoDimModifyCtrl.inputText eq  myField.componentType and myField.rendered}"
                                myConverter="#{myField.myconverter}"
                                myConverterInstance="#{myField.converterInstance}" 
                                myConverterFormat="#{myField.converterFormat}" 
                                myConverterParam="#{myField.converterParam}"
                                divider="#{myField.divider}"
                                myMinStrLength="#{myField.converterMinStrLength}" 
                                crudObject="#{twoDimModifyCtrl.myObject}"
                                myMaxValue="#{myField.maxValue}" 
                                shouldCheckNegative="#{myField.shouldCheckNegative}"
                                /> 
                            <mydynamic:uysInputMask 
                                myvalue="#{twoDimModifyCtrl.myObject[myField.key]}"
                                myFieldKey="#{myField.key}"
                                myrequired="#{myField.required}"
                                myreadonly="#{myField.readonly}" 
                                mystyle="#{myField.style}"
                                myCalculateOnCrudView="#{myField.calculateOnCrudView}"
                                myCalculateOnListView="#{myField.calculateOnListView}"
                                myCalculateOnSave="#{myField.calculateOnSave}"
                                label="#{myField.label}" 
                                rendered="#{twoDimModifyCtrl.inputMask eq myField.componentType and myField.rendered}"
                                myConverter="#{myField.myconverter}"
                                myConverterInstance="#{myField.converterInstance}" 
                                myConverterFormat="#{myField.converterFormat}" 
                                crudObject="#{twoDimModifyCtrl.myObject}"
                                myMaxValue="#{myField.maxValue}" 
                                shouldCheckNegative="#{myField.shouldCheckNegative}"
                                myMask="#{myField.mask}"
                                />
                            <mydynamic:uysInputTextArea 
                                myvalue="#{twoDimModifyCtrl.myObject[myField.key]}"
                                myreadonly="#{myField.readonly}" 
                                myrequired="#{myField.required}"
                                label="#{myField.label}" 
                                rendered="#{twoDimModifyCtrl.inputTextarea eq myField.componentType and myField.rendered}"
                                myconverter="#{myField.myconverter}"
                                />
                            <mydynamic:uysDateTimeEntry 
                                myvalue="#{twoDimModifyCtrl.myObject[myField.key]}"
                                myreadonly="#{myField.readonly}"
                                label="#{myField.label}" 
                                rendered="#{myField.componentType eq twoDimModifyCtrl.inputDate and myField.rendered}"
                                myconverter="#{myField.myconverter}"
                                myrequired="#{myField.required}"
                                mypattern="#{myField.datePattern}"
                                dateChange="#{twoDimModifyCtrl.dateChange}"
                                />
                            <mydynamic:uysSelectBooleanCheckbox 
                                myvalue="#{twoDimModifyCtrl.myObject[myField.key]}"
                                label="#{myField.label}" 
                                rendered="#{twoDimModifyCtrl.selectBooleanCheckbox eq  myField.componentType and myField.rendered}"
                                myconverter="#{myField.myconverter}"
                                />

                            <p:panelGrid 
                                columns="2"
                                rendered="#{twoDimModifyCtrl.inputFile eq  myField.componentType and myField.rendered}"
                                >
                                <p:button 
                                    value="Dosya Yükleme"
                                    onclick="PF('widget-var-page-file-upload').chooseButton.click();return;"                                
                                    >
                                </p:button>
                                <p:dataTable 
                                    value="#{twoDimModifyCtrl.listFileData}" 
                                    var="x"
                                    emptyMessage="eklenen dosya yok"
                                    class="class-data-table-inline-up-files"
                                    >
                                    <p:column>
                                        <h:outputText value="#{x.fileName}"/>
                                    </p:column>
                                    <p:column>
                                        <p:commandButton 
                                            value="sil" 
                                            action="#{twoDimModifyCtrl.deleteFile}" 
                                            update="@(.class-data-table-inline-up-files),idTwoDlgTabView:id-table-crud-dlg-tab-attachments,id-tab-view:id-table-file-list"
                                            >
                                            <f:setPropertyActionListener  target="#{twoDimModifyCtrl.toBeDeletedFileID}" value="#{x.fileID}"/>
                                        </p:commandButton>
                                    </p:column>
                                    <p:column>
                                        <h:outputLink 
                                            value="#{application.contextPath}/myDownloadServlet/#{x.fileID}"
                                            style="
                                            text-decoration:none;
                                            font-size: 14px;
                                            color:#112978;
                                            font-weight:bold;"
                                            >
                                            <h:outputText value="indir" />
                                        </h:outputLink>  
                                    </p:column>
                                </p:dataTable>
                            </p:panelGrid>
                        </p:outputPanel>

                        <p:outputPanel id="id-desc-#{myField.key}" class="#{myField.styleClass}">
                            <p:outputLabel
                                value="#{myField.description} &nbsp;&nbsp;"
                                rendered="#{myField.renderDesc}"
                                />
                            <p:commandButton 
                                icon="fa fa-info-circle" 
                                action="#{twoDimModifyCtrl.showMyFieldDesc}"
                                immediate="true"
                                value="Bilgi" 
                                update="id-desc-dlg-pnl"
                                rendered="#{myField.renderPopupDesc}"
                                style="font-size:10px"
                                >
                                <f:setPropertyActionListener value="#{myField}" target="#{twoDimModifyCtrl.selectedField}"/>
                            </p:commandButton>
                        </p:outputPanel>
                    </c:forEach>
                </p:panelGrid>
            </h:form>
            <br/>
            <br/>
        </p:scrollPanel>

    </p:outputPanel>


    <h:form 
        enctype="multipart/form-data"
        >         
        <!--validatorMessage="Dosya geçerli değil (Boyut, tip veya adet hatası)."-->
        <p:fileUpload 
            id="id-up-file"
            widgetVar="widget-var-page-file-upload"
            value="#{twoDimModifyCtrl.uploadedFile}"
            listener="#{twoDimModifyCtrl.upload}"
            cancelLabel="Vazgeç"
            uploadLabel="Yükle"
            label="Seç"
            auto="true"
            style="display:none;"
            update="@(.class-data-table-inline-up-files),idTwoDlgTabView:id-table-crud-dlg-tab-attachments,id-tab-view:id-table-file-list"
            >
            <p:validateFile 
                sizeLimit="15728640"
                allowTypes="#{twoDimModifyCtrl.mongoUploadFileType}"
                fileLimit="10"
                />
        </p:fileUpload>
    </h:form>
</html>

<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="http://primefaces.org/ui">

    <div class="flex flex-column gap-2 my-1">
        <h:panelGroup rendered="#{not empty formService.myForm.name}">
            <p:panel styleClass="p-0 border-round">
                <div class="flex align-items-center py-2 px-3">
                    <h:outputText value="#{formService.myForm.name}" styleClass="font-bold text-base text-900"/>
                </div>
            </p:panel>
        </h:panelGroup>
    </div>
</ui:composition>

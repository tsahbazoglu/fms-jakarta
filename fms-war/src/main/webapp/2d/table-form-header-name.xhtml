<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="http://primefaces.org/ui">

    <div class="flex flex-column gap-2 my-1">
        <h:panelGroup rendered="#{not empty formService.myForm.name}">
            <p:panel styleClass="p-0 border-round">
                <div class="flex align-items-center py-2 px-3">
                    <h:outputText value="#{formService.myForm.name}" styleClass="font-bold text-base text-900"/>
                </div>
            </p:panel>
        </h:panelGroup>

        <h:panelGroup rendered="#{twoDimModifyCtrl.selectedFormUserNote}">
            <p:panel styleClass="p-0 border-round">
                <div class="flex align-items-center gap-2 py-1 px-3">
                    <p:outputLabel value="Önemli açıklamalar mevcuttur. Detaylar için &#160;" 
                                   escape="false" 
                                   styleClass="text-xs font-semibold text-700"/>
                    <p:button icon="pi pi-info-circle"
                              title="İlgili detaylara ulaşabilirsiniz"
                              onclick="rcTableDesc();return false;"
                              styleClass="ui-button-outlined ui-button-secondary p-button-sm"/>
                </div>
            </p:panel>
        </h:panelGroup>
    </div>
</ui:composition>

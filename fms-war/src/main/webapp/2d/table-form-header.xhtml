<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:p="http://primefaces.org/ui"   
      xmlns:ui="jakarta.faces.facelets" 
      xmlns:c="jakarta.tags.core"
      >

    <h:head>
        <title></title>
    </h:head>

    <div class="ui-g">

        <div class="ui-g-12 ui-md-12 ui-lg-7">
            <p:panel>
                <div style="height: 35px;">
                    <p:outputLabel value="#{formService.myForm.name}"/>        
                </div>
            </p:panel>

            <p:spacer/>

            <p:panel>
                <div style="height: 35px;">
                    <ui:include src="ui-crud-tool-buttons.xhtml"/>
                </div>
            </p:panel>
        </div>

        <style>
            .fms-box {
                width: 100%;
                height: 110px;
                overflow: scroll;
            }
        </style>

        <div class="ui-g-12 ui-md-12 ui-lg-5">
            <p:panel>
                <div class="fms-box" >
                    <p>
                        <c:forEach items="#{twoDimModifyCtrl.selectedFormMessages}" var="mymessage">
                            <p:outputLabel value="#{mymessage}"/>
                            <br/>
                            <br/>
                        </c:forEach>
                    </p>
                </div>
            </p:panel>
        </div>

    </div>

</html>

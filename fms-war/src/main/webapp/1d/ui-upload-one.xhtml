<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:f="jakarta.faces.core"
      xmlns:h="jakarta.faces.html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:mydynamic="http://java.sun.com/jsf/composite/mydinamic"
      xmlns:mygrid="http://java.sun.com/jsf/composite/telmangrid">

    <h:head>
        <title></title>
    </h:head>


    <h:panelGroup 
        id="id-page-pnl-up-file"
        rendered="#{formService.myForm.multiUpload.enable}"
        >
        <br/>
        <p:panel
            rendered="#{formService.myForm.multiUpload.upload}"
            >
            <h:outputText value="Dosya Yükleme Aracı" style="font-size: var(--fms-font-size-2xl, 22px);font-weight: bolder;color: #b3b3b3;font-family: inherit;"/>
            <br/>
            <br/> 
            <h:form 
                id="idInputFileForm1D"
                enctype="multipart/form-data"
                rendered="#{not roleMB[formService.myForm.myProject.adminAndViewerRole]}"
                >        
                <!--validatorMessage="Dosya geçerli değil (Boyut, tip veya adet hatası)."-->
                <p:fileUpload 
                    value="#{crudOneDim.uploadedFile}"
                    listener="#{crudOneDim.upload}"
                    update="#{updateAjaxMB.action1dUploadFile}"
                    cancelLabel="Vazgeç"
                    uploadLabel="Yükle"
                    label="Seç"
                    >
                    <p:validateFile 
                        sizeLimit="15728640"
                        allowTypes="#{crudOneDim.mongoUploadFileType}"
                        fileLimit="#{crudOneDim.fileLimit}"
                        />
                </p:fileUpload>  
            </h:form>
        </p:panel>
        <br/> 
        <p:panel 
            id="id-uploaded-files"
            rendered="#{formService.myForm.multiUpload.list}"
            >
            <h:outputText value="Ekli Dosyalar" style="font-size: var(--fms-font-size-2xl, 22px);font-weight: bolder;color: #b3b3b3;font-family: inherit;"/>
            <br/>
            <br/> 
            <p:dataTable 
                value="#{crudOneDim.listFileData}" 
                var="x"
                >
                <p:column>
                    <f:facet name="header">
                        <h:outputText value="Dosya Adı"/> 
                    </f:facet>
                    <h:outputText value="#{x.fileName}"/> 
                </p:column>
                <p:column>
                    <f:facet name="header">
                        <h:outputText value="Dosya Boyutu"/>
                    </f:facet>
                    <h:outputText value="#{x.fileSize}"/> 

                </p:column>
                <p:column>
                    <f:facet name="header">
                        <h:outputText value="Durum"/>
                    </f:facet>
                    <h:outputText value="#{x.fileState}" style="background: #{x.fileColor}"/> 
                </p:column>

                <p:column
                    rendered="#{formService.myForm.multiUpload.delete}"
                    >
                    <f:facet name="header">
                        <h:outputText value="Sil"/> 
                    </f:facet>
                    <p:commandButton 
                        value="sil" 
                        action="#{crudOneDim.deleteFile}" 
                        rendered="#{formService.myForm.multiUpload.delete}"
                        update="#{updateAjaxMB.btn1dRemoveFile},:id-tab-view:crud1dForm"
                        >
                        <f:setPropertyActionListener  target="#{crudOneDim.toBeDeletedFileID}" value="#{x.fileID}"/>
                    </p:commandButton>
                </p:column>
                <p:column
                    rendered="#{formService.myForm.multiUpload.download}"
                    >
                    <f:facet name="header">
                        <h:outputText value="İndir"/>  
                    </f:facet>
                    <h:outputLink 
                        value="#{application.contextPath}/myDownloadServlet/#{x.fileID}"
                        style="
                        text-decoration:none;
                        font-size: var(--fms-font-size-base, 14px);
                        font-family: inherit;
                        color:#112978;
                        font-weight:bold;"
                        >
                        <h:outputText value="indir" />
                    </h:outputLink>  
                </p:column>
            </p:dataTable>
        </p:panel>
    </h:panelGroup>


</html>

<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:f="jakarta.faces.core"
      xmlns:h="jakarta.faces.html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:c="jakarta.tags.core"
      xmlns:dh="http://dadhawk.com/faces"
>

    <h:head>
        <title></title>
    </h:head>

    <p:panel>
        <h:form rendered="#{formService.myForm.historyRendered}">
            <h:panelGroup id="id-filter-history-zet-panel-grid" layout="block" styleClass="ui-g ui-fluid">
                <c:forEach items="#{pivotViewerCtrl.zetDimension}" var="filterFieldStructure">

                    <div class="ui-g-12 ui-md-3" style="padding: 6px; box-sizing: border-box; vertical-align: top;">

                        <p:outputLabel value="#{filterFieldStructure['shortName']}"
                                       style="font-weight: bold; display: block; margin-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;"/>

                        <h:panelGroup layout="block">
                            <p:selectOneMenu  
                                value="#{filterService.guiFilterHistory[filterFieldStructure.field]}"
                                converter="#{filterFieldStructure.myconverter}"
                                rendered="#{'member' eq filterFieldStructure.key}" 
                                filter="true" 
                                filterMatchMode="contains"   
                                caseSensitive="true"
                            >
                                <p:ajax 
                                    listener="#{pivotViewerCtrl.valueChangeListenerZet}" 
                                    update="#{updateAjaxMB.filterNdDataHistory}"
                                />
                                <f:selectItems value="#{filterFieldStructure.listOfValues}"/>
                                <f:attribute name="myKey" value="#{filterFieldStructure.key}"/>
                            </p:selectOneMenu>
                            <p:selectOneMenu  
                                value="#{filterService.guiFilterHistory[filterFieldStructure.field]}"
                                converter="#{filterFieldStructure.myconverter}"
                                rendered="#{'period' eq filterFieldStructure.key}" 
                            >
                                <p:ajax 
                                    listener="#{pivotViewerCtrl.valueChangeListenerZet}" 
                                    update="#{updateAjaxMB.filterNdDataHistory}" />
                                <f:selectItems value="#{filterFieldStructure.listOfValues}"/>
                                <f:attribute name="myKey" value="#{filterFieldStructure.key}"/>
                            </p:selectOneMenu>
                            <p:selectOneMenu  
                                value="#{filterService.guiFilterHistory[filterFieldStructure.field]}"
                                converter="#{filterFieldStructure.myconverter}"
                                rendered="#{'periodFilter' eq filterFieldStructure.key}" 
                            >
                                <p:ajax 
                                    listener="#{pivotViewerCtrl.valueChangeListenerZet}" 
                                    update="#{updateAjaxMB.filterNdDataHistory}"/>
                                <f:selectItems value="#{filterFieldStructure.listOfValues}"/>
                                <f:attribute name="myKey" value="#{filterFieldStructure.key}"/>
                            </p:selectOneMenu>
                            <p:selectOneMenu  
                                value="#{filterService.guiFilterHistory[filterFieldStructure.field]}"
                                converter="#{filterFieldStructure.myconverter}"
                                rendered="#{'template' eq filterFieldStructure.key}" 
                            >
                                <p:ajax 
                                    listener="#{pivotViewerCtrl.valueChangeListenerZet}" 
                                    update="#{updateAjaxMB.filterNdDataHistory}"/>
                                <f:selectItems value="#{filterFieldStructure.listOfValues}"/>
                                <f:attribute name="myKey" value="#{filterFieldStructure.key}"/>
                            </p:selectOneMenu>
                        </h:panelGroup>
                    </div>
                </c:forEach>
            </h:panelGroup>

            <p:panelGrid
                columns="1"
                layout="grid"
                >
                <c:forEach items="#{formService.myForm.fieldsRowKeys}" var="fieldKey">
                    <h:panelGrid columns="1">
                        <h:outputText
                            value="#{pivotViewerCtrl.componentMap[fieldKey].label}" 
                            escape="false"
                            style="#{pivotViewerCtrl.componentMap[fieldKey].style}"
                            rendered="#{pivotViewerCtrl.componentMap[fieldKey].rendered}"
                            >
                        </h:outputText>
                        <p:selectOneMenu
                            value="#{pivotViewerCtrl.rowObject[fieldKey]}"
                            label="#{pivotViewerCtrl.componentMap[fieldKey].label}" 
                            rendered="#{'selectOneMenu' eq  pivotViewerCtrl.componentMap[fieldKey].componentType and pivotViewerCtrl.componentMap[fieldKey].rendered}"
                            converter="#{pivotViewerCtrl.componentMap[fieldKey].myconverter}"
                            >
                            <f:selectItems value="#{pivotViewerCtrl.componentMap[fieldKey].items}"/>
                        </p:selectOneMenu>   
                    </h:panelGrid>
                </c:forEach>   
            </p:panelGrid>
        </h:form>
    </p:panel>

    <p:outputPanel id="historyMyGridReadOnly">
        <p:scrollPanel mode="native" 
                       style="width:95%;">
            <dh:dhGrid id="id-grid-readonly"
                       rowCount="#{gridBean.rowCount}"
                       colCount="#{gridBean.colCount}"
                       content="#{gridBean.content}"
                       captions="#{gridBean.captions}"
                       componentMap="#{gridBean.componentMap}"
                       readOnlyCells="#{gridBean.readOnlyCells}"
                       cssCompatible="primethemes"
                       cellStyles="#{gridBean.cellStyles}"
                       readOnly="true"
            />
        </p:scrollPanel>

    </p:outputPanel>
</html>

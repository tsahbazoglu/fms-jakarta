<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:p="http://primefaces.org/ui">

<h:panelGrid columns="6" rendered="#{not esignViewCtrl.preventedMultiTab}">
    <p:button
            icon="pi pi-save"
            title="#{msg['kaydet']}"
            rendered="#{formService.myForm.myActions.save}"
            onclick="rcPivotSave();return false;"
    />
    <p:button
            icon="pi pi-send"
            value="#{formService.myForm.myActions.sendFormAction.enableResult.caption}"
            rendered="#{formService.myForm.myActions.sendForms}"
            onclick="checkSavedStatus();return false;"
    />
    <p:button
            icon="pi pi-info-circle"
            title="#{msg['bu.sayfa.ile.ilgili.aciklamalar']}"
            rendered="#{pivotModifierCtrl.selectedFormUserNote}"
            onclick="rcPivotShowDesc();return false;"
    />
    <p:button
            icon="pi pi-file-excel"
            title="#{msg['excele.aktar']}"
            rendered="#{formService.myForm.myActions.download}"
            onclick="rcPivotDownlodExcel();return false;"
    />
    <p:button
            icon="pi pi-book"
            value="#{msg['e.i.mza.sureci']}"
            rendered="#{formService.myForm.myActions.eimza2D}"
            onclick="rcPivotEsign();return false;"
    />

</h:panelGrid>

</html>

<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>dadhawk.com demo</title>
    <style>
        :root { --bg:#f6f7f9; --card:#fff; --fg:#1c1f24; --mut:#6b7280; --ac:#2f5bea; --bd:#e2e5ea; --err:#c62828; }
        @media (prefers-color-scheme: dark) { :root { --bg:#14161a; --card:#1e2127; --fg:#e8eaed; --mut:#9aa0a6; --bd:#333842; --ac:#6d8cff; --err:#ff6b6b; } }
        * { box-sizing:border-box; }
        body { margin:0; font:16px system-ui,sans-serif; background:var(--bg); color:var(--fg); }
        main { max-width:560px; margin:0 auto; padding:16px; }
        .card { background:var(--card); border:1px solid var(--bd); border-radius:12px; padding:16px; margin-bottom:16px; }
        h1 { font-size:1.3rem; margin:8px 0 16px; } h2 { font-size:1.05rem; margin:0 0 12px; }
        input,button,select { font:inherit; padding:10px 12px; border-radius:8px; border:1px solid var(--bd); background:var(--bg); color:var(--fg); width:100%; margin-bottom:10px; }
        button { background:var(--ac); color:#fff; border:0; cursor:pointer; }
        button.sec { background:transparent; color:var(--ac); border:1px solid var(--ac); }
        button.del { width:auto; padding:6px 10px; margin:0; background:var(--err); }
        .row { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:8px 0; border-top:1px solid var(--bd); }
        .mut { color:var(--mut); font-size:.9rem; } .err { color:var(--err); min-height:1.2em; }
        .hide { display:none; }
    </style>
</head>
<body>
<main>
    <h1>dadhawk.com invoices</h1>

    <section id="login" class="card">
        <h2>Sign in</h2>
        <input id="u" placeholder="Username (alice, bob, carol)" autocomplete="username" autocapitalize="none">
        <input id="p" type="password" placeholder="Password" autocomplete="current-password">
        <input id="c" placeholder="Company (optional: acme, globex)" autocapitalize="none">
        <button id="loginBtn">Sign in</button>
        <div id="lerr" class="err"></div>
    </section>

    <section id="app" class="card hide">
        <h2 id="who"></h2>
        <select id="cs" class="hide" aria-label="Company"></select>
        <div id="create" class="hide">
            <input id="t" placeholder="Invoice title">
            <input id="a" type="number" placeholder="Amount">
            <button id="addBtn">Add invoice</button>
        </div>
        <div id="list"></div>
        <div id="aerr" class="err"></div>
        <button class="sec" id="outBtn">Sign out</button>
    </section>
</main>

<script>
    const $ = id => document.getElementById(id);
    let token = null, me = null;   // kept in memory only; a page refresh signs you out

    async function api(path, opts = {}) {
        const r = await fetch('api/' + path, {
            ...opts,
            headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: 'Bearer ' + token } : {}) }
        });
        if (r.status === 401 && token) { signOut(); throw new Error('Session expired, sign in again'); }
        if (r.status === 403) { const e = await r.json().catch(() => ({})); throw new Error(e.error || 'Not allowed for your role'); }
        if (!r.ok && r.status !== 204) {
            const e = await r.json().catch(() => ({})); throw new Error(e.error || 'Error ' + r.status);
        }
        return r.status === 204 ? null : r.json();
    }

    function enter(res) {
        me = { ...(me || {}), ...res }; token = res.token;
        $('login').classList.add('hide'); $('app').classList.remove('hide');
        $('who').textContent = `${me.userId} · ${me.companyId} · ${me.role}`;
        const cs = $('cs'); cs.replaceChildren();
        for (const c of me.companies) { const o = document.createElement('option'); o.value = o.textContent = c; cs.append(o); }
        cs.value = me.companyId;
        cs.classList.toggle('hide', me.companies.length < 2);   // consultants with several companies get a switcher
        $('create').classList.toggle('hide', !me.permissions.includes('invoices:create'));
        load();
    }

    $('loginBtn').onclick = async () => {
        $('lerr').textContent = '';
        try {
            me = null;
            enter(await api('auth/login', { method: 'POST', body: JSON.stringify({
                    username: $('u').value.trim(), password: $('p').value, companyId: $('c').value.trim() }) }));
            $('p').value = '';
        } catch (e) { $('lerr').textContent = e.message; }
    };

    // Switch company without typing the password again; the server re-reads LDAP and issues a new token.
    $('cs').onchange = async () => {
        $('aerr').textContent = '';
        try { enter(await api('auth/switch', { method: 'POST', body: JSON.stringify({ companyId: $('cs').value }) })); }
        catch (e) { $('aerr').textContent = e.message; $('cs').value = me.companyId; }
    };

    async function load() {
        $('aerr').textContent = '';
        const box = $('list'); box.replaceChildren();
        try {
            const items = await api('invoices');
            if (!items.length) { const p = document.createElement('div'); p.className = 'mut'; p.textContent = 'No invoices yet.'; box.append(p); }
            for (const i of items) {
                const row = document.createElement('div'); row.className = 'row';
                const txt = document.createElement('span'); txt.textContent = `${i.title} — ${i.amount}`;   // textContent avoids XSS
                row.append(txt);
                if (me.permissions.includes('invoices:delete')) {
                    const b = document.createElement('button'); b.className = 'del'; b.textContent = 'Delete';
                    b.onclick = async () => { try { await api('invoices/' + i._id, { method: 'DELETE' }); load(); } catch (e) { $('aerr').textContent = e.message; } };
                    row.append(b);
                }
                box.append(row);
            }
        } catch (e) { $('aerr').textContent = e.message; }
    }

    $('addBtn').onclick = async () => {
        try {
            await api('invoices', { method: 'POST', body: JSON.stringify({ title: $('t').value, amount: Number($('a').value) }) });
            $('t').value = ''; $('a').value = ''; load();
        } catch (e) { $('aerr').textContent = e.message; }
    };

    function signOut() { token = me = null; $('app').classList.add('hide'); $('login').classList.remove('hide'); }
    $('outBtn').onclick = signOut;
</script>
</body>
</html>
